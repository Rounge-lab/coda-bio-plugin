[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "coda-bio-plugin"
dynamic = ["version"]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [
    {name = "Sverre Branders", email = "sverrbra@uio.no"},
]
requires-python = ">=3.14"
dependencies = [
    "workflow-coda",
]

[project.optional-dependencies]
dev = [
    "build",
    "pre-commit>=4",
    "mypy>=2.4",
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.8",
]
docs = [
    "build",
    "autodoc-pydantic",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-rtd-dark-mode",
    "sphinx-rtd-theme",
]

[project.entry-points."workflow_coda.plugins"]
bio = "coda_bio_plugin.plugin:get_plugin"

[tool.hatch.version]
path = "src/coda_bio_plugin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/coda_bio_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--tb=short",
]

[tool.ruff]
exclude = [
    ".git",
    "__pypackages__",
]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "N",
    "C90",
    "W",
    "Q",
    "RET",
    "UP",
]
ignore = ["E501"] # Should be handled by ruff format
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
exclude = ["^docs/"]
mypy_path = "src"
# plugins = ["pydantic.mypy"]

check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

strict_equality = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.14,<3.15"

[tool.pixi.pypi-dependencies]
workflow-coda = { git = "ssh://git@github.com/sverre-branders/workflow-coda.git", rev = "ca4a948" }
coda-bio-plugin = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.feature.docs.pypi-dependencies]
coda-bio-plugin = { path = ".", editable = true, extras = ["docs"] }

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
docs = { features = ["docs"], solve-group = "docs" }

[tool.pixi.tasks]
build = "python -m build"
pytest = "python -m pytest --cov=coda_bio_plugin --cov-report=term-missing"
ruff-check = "ruff check ."
ruff-check-fix = "ruff check . --fix"
ruff-format = "ruff format ."
ruff-format-check = "ruff format --check ."
pre-commit = "pre-commit run --all-files"
pre-commit-install = "pre-commit install --install-hooks"
typecheck = "python -m mypy"

fastqc-verify = { cmd = "workflow-coda verify verified-manifest.json fastqc_data.txt --id fastqc --type org.example.fastqc --format bio.fastqc --schema-version 1.0 --producer-name \"FastQC example\" --producer-version 1.0", cwd = "docs/examples/fastqc" }
fastqc-build = "workflow-coda build docs/examples/fastqc/verified-manifest.json docs/examples/fastqc/layout.yaml -o fastqc-report.html"

lint = { depends-on = ["ruff-check", "ruff-format-check"] }
lint-fix = { depends-on = ["ruff-format", "ruff-check-fix"] }
test = { depends-on = ["lint", "typecheck", "pytest"] }
fastqc-test = {depends-on = ["fastqc-verify", "fastqc-build"] }


[tool.pixi.feature.docs.tasks]
docs = { cmd = "sphinx-build -M html ./source ./build --fail-on-warning", cwd = "docs" }
docs-clean = { cmd = "sphinx-build -M clean ./source ./build", cwd = "docs" }
