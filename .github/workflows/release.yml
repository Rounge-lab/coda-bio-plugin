name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0; without v)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: coda-bio-plugin-release
  cancel-in-progress: false

jobs:
  guard:
    name: Validate release request
    runs-on: ubuntu-latest

    steps:
      - name: Releases may only be dispatched from main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" != "main" ]]; then
            echo "::error::Releases may only be dispatched from main."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.81.0
          cache: true

      - name: Assert version matches source and tag is new
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          pixi run python - <<'PY'
          import ast
          import os
          import re
          import tomllib
          from pathlib import Path

          requested = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", requested):
              raise SystemExit("Expected a version such as 0.1.0, without v.")

          config = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          source = Path(config["tool"]["hatch"]["version"]["path"])
          tree = ast.parse(source.read_text(encoding="utf-8"))

          versions = []
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  targets = node.targets
                  value = node.value
              elif isinstance(node, ast.AnnAssign):
                  targets = [node.target]
                  value = node.value
              else:
                  continue

              if any(
                  isinstance(target, ast.Name)
                  and target.id == "__version__"
                  for target in targets
              ):
                  if value is None:
                      raise SystemExit("__version__ must have a value.")
                  actual = ast.literal_eval(value)
                  if not isinstance(actual, str):
                      raise SystemExit("__version__ must be a string.")
                  versions.append(actual)

          if len(versions) != 1:
              raise SystemExit(
                  f"Expected one __version__ assignment in {source}."
              )

          actual = versions[0]
          if requested != actual:
              raise SystemExit(
                  f"Requested version {requested} does not match "
                  f"{source} version {actual}."
              )
          PY

          if git show-ref --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            echo "::error::Tag v${RELEASE_VERSION} already exists."
            exit 1
          fi

  checks:
    name: Tests, documentation, and previews
    needs: guard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.81.0
          cache: true

      - name: Lint, type-check, and test
        run: pixi run test

      - name: Verify examples and build documentation with previews
        run: pixi run -e docs docs

  release:
    name: Build and publish GitHub release
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.81.0
          cache: true

      - name: Build source distribution and wheel
        run: pixi run build

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.whl > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            dist/*.tar.gz \
            dist/*.whl \
            dist/SHA256SUMS \
            --target "$RELEASE_COMMIT" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes
