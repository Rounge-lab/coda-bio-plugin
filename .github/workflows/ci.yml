name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.81.0
          cache: true

      - name: Run linting, type checks, and tests
        run: pixi run test

      - name: Build distribution packages
        run: pixi run build

  documentation:
    name: Documentation and component previews
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.81.0
          cache: true

      - name: Verify examples and build documentation with previews
        run: pixi run -e docs docs

      - name: Upload documentation for inspection
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build/html/
          if-no-files-found: error
